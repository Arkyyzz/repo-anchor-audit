name: Bug report
description: Report a reproducible failure or incorrect link finding
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
      description: Mention the Markdown renderer when heading behavior matters.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and command
      description: Use synthetic content. Do not include private files or credentials.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Tool version, Node.js version, and operating system
    validations:
      required: true
